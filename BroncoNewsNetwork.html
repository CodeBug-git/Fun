<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GistFeed</title>
    <!-- Using Tailwind for quick styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f3f4f6; font-family: sans-serif; }
        .post { background: white; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #e5e7eb; }
    </style>
</head>
<body class="max-w-xl mx-auto p-6">

    <header class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-extrabold text-indigo-600">GistFeed</h1>
        <p class="text-xs text-gray-500">Run by your custom HTML runner</p>
    </header>

    <!-- Gist Manager -->
    <div class="bg-white p-4 rounded-xl shadow-sm mb-8">
        <h2 class="text-sm font-semibold text-gray-600 mb-2">Gist Post Manager</h2>
        <div class="grid gap-4">
            <input id="authorInput" type="text" placeholder="Author name"
                   class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
            <textarea id="postTextarea" rows="6" placeholder="Write a new post here..."
                      class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none resize-none"></textarea>
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <button id="refreshBtn" class="bg-slate-500 text-white px-4 py-2 rounded-lg font-medium hover:bg-slate-600 transition">
                    Refresh
                </button>
                <button id="publishBtn" class="bg-emerald-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-emerald-700 transition">
                    Publish
                </button>
            </div>
            <p class="text-xs text-gray-500">Posts are published to the hardcoded Gist using the hardcoded token.</p>
        </div>
    </div>

    <!-- Feed -->
    <div id="feed">
        <!-- Posts will appear here -->
        <div id="emptyState" class="text-center py-12 text-gray-400">
            No posts yet. Try pasting a public Gist ID.
        </div> 
    </div>

    <script>
        const GIST_ID = '561fa481c5f49a75b7efca7d0b189aec';
        const TOKEN = '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'; // Replace with your actual GitHub token with gist scope

        const publishBtn = document.getElementById('publishBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const authorInput = document.getElementById('authorInput');
        const postTextarea = document.getElementById('postTextarea');
        const feed = document.getElementById('feed');
        const emptyState = document.getElementById('emptyState');

        let currentFileName = 'posts.json';

        async function getPostsFileContent(postsFile) {
            if (!postsFile) {
                return null;
            }

            let fileContent = postsFile.content;
            if (postsFile.truncated && postsFile.raw_url) {
                const rawResponse = await fetch(`${postsFile.raw_url}?_=${Date.now()}`, { cache: 'no-store' });
                if (rawResponse.ok) {
                    fileContent = await rawResponse.text();
                }
            }

            return fileContent;
        }

        async function renderGist(gist) {
            feed.innerHTML = '';
            const files = gist.files || {};
            const postsFile = files['posts.json'];

            if (!postsFile) {
                feed.innerHTML = '<div class="text-center py-12 text-gray-400">No posts.json file found in this Gist.</div>';
                return;
            }

            const fileContent = await getPostsFileContent(postsFile);

            let posts;
            try {
                posts = JSON.parse(fileContent);
                if (!Array.isArray(posts)) {
                    posts = [];
                }
            } catch (err) {
                posts = []; // Treat invalid JSON as empty posts
            }

            if (posts.length === 0) {
                feed.innerHTML = '<div class="text-center py-12 text-gray-400">No posts yet.</div>';
                return;
            }

            posts.forEach(post => {
                const postDiv = document.createElement('div');
                postDiv.className = 'post';

                const timestamp = post.timestamp ? new Date(post.timestamp).toLocaleString() : 'Unknown time';
                const authorName = post.author ? escapeHtml(post.author) : 'Anonymous';

                postDiv.innerHTML = `
                    <div class="flex items-center justify-between mb-3">
                        <div>
                            <p class="text-sm font-semibold text-slate-800">${authorName}</p>
                            <p class="text-xs text-gray-500">${escapeHtml(timestamp)}</p>
                        </div>
                        <a href="${gist.html_url}" target="_blank" rel="noreferrer" class="text-indigo-600 text-sm hover:underline">View on GitHub</a>
                    </div>
                    <pre class="whitespace-pre-wrap break-words text-sm text-slate-700 bg-slate-50 rounded-lg p-4 border border-slate-200">${escapeHtml(post.content || '')}</pre>
                `;

                feed.appendChild(postDiv);
            });
        }

        function showError(message) {
            feed.innerHTML = `<div class="text-center py-12 text-red-500">${escapeHtml(message)}</div>`;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        async function loadGist() {
            emptyState.style.display = 'none';

            try {
                const response = await fetch(`https://api.github.com/gists/${GIST_ID}?_=${Date.now()}`, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`Unable to load gist: ${response.status} ${response.statusText}`);
                }

                const gistData = await response.json();
                await renderGist(gistData);
            } catch (err) {
                console.error(err);
                showError('Could not load the Gist. Please check the ID and try again.');
            }
        }

        async function publishPost() {
            const newText = postTextarea.value.trim();

            if (!newText) {
                alert('Write a post before publishing.');
                return;
            }

            publishBtn.disabled = true;
            publishBtn.innerText = 'Publishing...';

            try {
                const gistResponse = await fetch(`https://api.github.com/gists/${GIST_ID}`);
                if (!gistResponse.ok) {
                    throw new Error(`Unable to load gist for update: ${gistResponse.status} ${gistResponse.statusText}`);
                }

                const gistData = await gistResponse.json();
                const files = gistData.files || {};
                const postsFile = files['posts.json'];
                let posts = [];

                if (postsFile) {
                    try {
                        const fileContent = await getPostsFileContent(postsFile);
                        posts = JSON.parse(fileContent || '[]');
                        if (!Array.isArray(posts)) {
                            posts = [];
                        }
                    } catch (err) {
                        posts = [];
                    }
                }

                const newPost = {
                    author: authorInput.value.trim() || 'Anonymous',
                    content: newText,
                    timestamp: new Date().toISOString()
                };

                posts.unshift(newPost); // Add to beginning for latest first

                const updateResponse = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `token ${TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        files: {
                            'posts.json': { content: JSON.stringify(posts, null, 2) }
                        }
                    })
                });

                if (!updateResponse.ok) {
                    throw new Error(`Update failed: ${updateResponse.status} ${updateResponse.statusText}`);
                }

                await loadGist();
                postTextarea.value = '';
                alert('Post published successfully.');
            } catch (err) {
                console.error(err);
                showError('Failed to publish post. Check your token scope and Gist ID.');
            } finally {
                publishBtn.disabled = false;
                publishBtn.innerText = 'Publish';
            }
        }

        window.onload = loadGist;
        refreshBtn.addEventListener('click', loadGist);
        publishBtn.addEventListener('click', publishPost);
    </script>
</body>
</html>
